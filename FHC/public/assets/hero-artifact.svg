<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030610"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1ED7E8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1ED7E8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1ED7E8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="45%" r="25%">
      <stop offset="0%" stop-color="#1ED7E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1ED7E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="url(#bg)"/>

  <!-- Atmospheric glow -->
  <ellipse cx="400" cy="500" rx="300" ry="400" fill="url(#core-glow)" filter="url(#softglow)"/>

  <!-- Main body - layered matte black -->
  <rect x="220" y="180" width="360" height="700" rx="6" fill="#0c1420" stroke="#1a2848" stroke-width="1"/>
  <rect x="230" y="190" width="340" height="680" rx="4" fill="#101c2e"/>

  <!-- Panel lines - cyan -->
  <line x1="240" y1="250" x2="560" y2="250" stroke="#1ED7E8" stroke-width="0.8" opacity="0.4"/>
  <line x1="240" y1="400" x2="560" y2="400" stroke="#1ED7E8" stroke-width="0.8" opacity="0.3"/>
  <line x1="240" y1="550" x2="560" y2="550" stroke="#1ED7E8" stroke-width="0.8" opacity="0.3"/>
  <line x1="240" y1="700" x2="560" y2="700" stroke="#1ED7E8" stroke-width="0.8" opacity="0.4"/>

  <!-- Side panels -->
  <rect x="220" y="200" width="8" height="660" rx="2" fill="#141c30"/>
  <rect x="572" y="200" width="8" height="660" rx="2" fill="#141c30"/>

  <!-- Core chamber - recessed -->
  <rect x="300" y="350" width="200" height="250" rx="4" fill="#080e18"/>
  <rect x="305" y="355" width="190" height="240" rx="3" fill="#060a14"/>

  <!-- Core glow -->
  <ellipse cx="400" cy="475" rx="80" ry="100" fill="url(#cyan-glow)" filter="url(#blur)"/>

  <!-- Core crystal -->
  <polygon points="400,420 430,475 400,530 370,475" fill="#1ED7E8" opacity="0.8"/>
  <polygon points="400,430 420,475 400,520 380,475" fill="#ffffff" opacity="0.3"/>

  <!-- Top module -->
  <rect x="280" y="140" width="240" height="50" rx="3" fill="#0e1628"/>
  <rect x="285" y="145" width="230" height="40" rx="2" fill="#121a2c"/>

  <!-- Antenna -->
  <rect x="396" y="60" width="8" height="85" rx="3" fill="#0e1628"/>
  <circle cx="400" cy="55" r="6" fill="#1ED7E8" opacity="0.7"/>
  <circle cx="400" cy="55" r="12" fill="#1ED7E8" opacity="0.15" filter="url(#blur)"/>

  <!-- Edge highlights - cyan -->
  <line x1="220" y1="180" x2="580" y2="180" stroke="#1ED7E8" stroke-width="1.2" opacity="0.5"/>
  <line x1="220" y1="880" x2="580" y2="880" stroke="#1ED7E8" stroke-width="1.2" opacity="0.5"/>
  <line x1="220" y1="180" x2="220" y2="880" stroke="#1ED7E8" stroke-width="0.8" opacity="0.3"/>
  <line x1="580" y1="180" x2="580" y2="880" stroke="#1ED7E8" stroke-width="0.8" opacity="0.3"/>

  <!-- Magenta accents -->
  <line x1="300" y1="350" x2="500" y2="350" stroke="#FF1687" stroke-width="0.8" opacity="0.3"/>
  <line x1="300" y1="600" x2="500" y2="600" stroke="#FF1687" stroke-width="0.8" opacity="0.3"/>

  <!-- Indicator lights -->
  <circle cx="320" cy="340" r="3" fill="#1ED7E8" opacity="0.8"/>
  <circle cx="480" cy="340" r="3" fill="#FF1687" opacity="0.8"/>
  <circle cx="320" cy="610" r="3" fill="#FF1687" opacity="0.8"/>
  <circle cx="480" cy="610" r="3" fill="#1ED7E8" opacity="0.8"/>

  <!-- Corner bolts -->
  <circle cx="250" cy="220" r="4" fill="#1a2848" stroke="#1ED7E8" stroke-width="0.5" opacity="0.6"/>
  <circle cx="550" cy="220" r="4" fill="#1a2848" stroke="#1ED7E8" stroke-width="0.5" opacity="0.6"/>
  <circle cx="250" cy="840" r="4" fill="#1a2848" stroke="#1ED7E8" stroke-width="0.5" opacity="0.6"/>
  <circle cx="550" cy="840" r="4" fill="#1a2848" stroke="#1ED7E8" stroke-width="0.5" opacity="0.6"/>

  <!-- Vent grilles -->
  <rect x="340" y="750" width="120" height="4" rx="1" fill="#080e18" opacity="0.8"/>
  <rect x="340" y="760" width="120" height="4" rx="1" fill="#080e18" opacity="0.8"/>
  <rect x="340" y="770" width="120" height="4" rx="1" fill="#080e18" opacity="0.8"/>

  <!-- Base platform -->
  <rect x="180" y="880" width="440" height="15" rx="2" fill="#0a1220"/>
  <line x1="180" y1="880" x2="620" y2="880" stroke="#1ED7E8" stroke-width="1" opacity="0.5"/>

  <!-- Placeholder text -->
  <text x="400" y="1050" text-anchor="middle" fill="#1ED7E8" opacity="0.15" font-family="monospace" font-size="11">
    REPLACE WITH CINEMATIC HERO ARTWORK
  </text>
</svg>
